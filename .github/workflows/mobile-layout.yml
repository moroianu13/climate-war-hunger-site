name: Keep published report responsive

on:
  push:
    branches: [main]
    paths:
      - index.html
      - mobile-layout.css
      - mobile-layout.js
      - scripts/ensure_mobile_layout.py
      - .github/workflows/mobile-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-mobile-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile assets to generated Quarto HTML if missing
        run: python3 scripts/ensure_mobile_layout.py
      - name: Commit generated HTML changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No HTML update is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Include mobile layout on public report"
          git push origin HEAD:main
